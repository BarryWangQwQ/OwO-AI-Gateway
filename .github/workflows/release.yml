# Build Windows and Linux releases with the owo CLI inside. macOS is built locally.
# A v* tag collects CI assets in a draft release; upload the local DMG, then publish
# after all three platform packages have been checked.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config build-essential patchelf libfuse2 xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: apps/desktop
        # Same registry as apps/desktop/bunfig.toml: bun.lock stores the tarball URLs it resolved,
        # so the lockfile only stays frozen if every machine installs from one registry.
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmmirror.com
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: apps/desktop
        run: bun run release

      - uses: actions/upload-artifact@v7
        with:
          name: OwO-AI-Gateway-${{ matrix.name }}
          path: target/release/OwO-AI-Gateway_*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "OwO AI Gateway $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
