# Built-in provider presets.
#
# A preset is data, not code: adding an OpenAI-compatible provider is a new
# table here, never a new routing branch. `opencodex_id` is the preset's id in
# the reference registry; the parity tooling uses it.
#
# Fields:
#   display_name, adapter, base_url    required
#   auth         bearer | header | query | none     (default: bearer)
#   auth_param   header/query name for auth = header | query
#   api_key      suggested key reference when the user sets none
#   private_network = true   base URL is a local runtime (loopback allowed)
#   models       static upstream model ids known for the preset

# OpenAI is best driven through the Responses API; this build implements
# Chat Completions only, and `https://api.openai.com/v1` serves both, so the
# preset uses `openai-chat` until `openai-responses` lands (presets whose
# adapter is not implemented are hidden by the desktop wizard and disabled by
# the registry).
[presets.openai]
display_name = "OpenAI"
adapter = "openai-chat"
base_url = "https://api.openai.com/v1"
api_key = "env:OPENAI_API_KEY"
opencodex_id = "openai-apikey"

[presets.anthropic]
display_name = "Anthropic"
adapter = "anthropic"
base_url = "https://api.anthropic.com"
auth = "header"
auth_param = "x-api-key"
api_key = "env:ANTHROPIC_API_KEY"
opencodex_id = "anthropic-apikey"
models = ["claude-sonnet-5", "claude-opus-5-5", "claude-haiku-4-5"]

# Current Claude models accept images and at least 64k output tokens. The 200k
# context keeps clients' auto-compaction inside standard pricing; raise it per
# provider (`model_defaults.context_window`) to use the 1M window.
[presets.anthropic.model_defaults]
context_window = 200000
max_output_tokens = 64000
reasoning_efforts = ["low", "medium", "high", "xhigh", "max"]
default_reasoning_effort = "medium"
capabilities = { vision = true, tools = true, parallel_tools = true }

[presets.google]
display_name = "Gemini"
adapter = "google"
base_url = "https://generativelanguage.googleapis.com"
auth = "header"
auth_param = "x-goog-api-key"
api_key = "env:GEMINI_API_KEY"
opencodex_id = "google"

